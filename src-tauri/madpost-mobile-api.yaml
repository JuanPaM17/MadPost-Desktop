      summary: Cancelar la orden completa (cerrar mesa sin cobrar)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Orden cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /api/v1/tables/{id}/order/delivery:
