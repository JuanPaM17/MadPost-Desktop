                        $ref: "#/components/schemas/Sale"

  # ── Sales ───────────────────────────────────────────────────────────────────

  /api/v1/sales:
    get:
      tags: [Ventas]
      summary: Listar ventas
      description: |
        Filtros via query param `filter`:
        - `attended` (default) — ventas creadas por el usuario autenticado
        - `collected` — ventas cobradas por el usuario autenticado
        - `all` — todas las ventas (SELLER lo ignora y ve `attended`)
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [attended, collected, all]
            default: attended
      responses:
        "200":
          description: Ventas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      tags: [Ventas]
      summary: Crear una venta directa (POS sin mesa)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [total, items]
              properties:
                paymentMethod:
                  type: string
                  enum: [CASH, CARD, MIXED]
                  default: CASH
                total:
                  type: number
                cashGiven:
                  type: number
                  nullable: true
                cashAmount:
                  type: number
                  nullable: true
                cardAmount:
                  type: number
                  nullable: true
                deliveryTypeId:
                  type: string
                  nullable: true
                isDelivery:
                  type: boolean
                  nullable: true
                deliveryFee:
                  type: number
                  nullable: true
                notes:
                  type: string
                  nullable: true
                clientName:
                  type: string
                  nullable: true
                items:
                  type: array
                  items:
                    type: object
                    required: [productName, unitPrice, quantity]
                    properties:
                      productId:
                        type: string
                        nullable: true
                      productName:
                        type: string
                      unitPrice:
                        type: number
                      quantity:
                        type: number
                      selectedOption:
                        type: string
                        nullable: true
                      notes:
                        type: string
                        nullable: true
                      additions:
                        type: array
                        items:
                          type: object
                      sauces:
                        type: array
                        items:
                          type: string
                          description: ID de la salsa
      responses:
        "201":
          description: Venta creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  saleId:
                    type: string
                  saleNumber:
                    type: integer

  /api/v1/sales/{id}:
    get:
      tags: [Ventas]
      summary: Obtener detalle de una venta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Venta completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "404":
          description: Venta no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── WebSocket ───────────────────────────────────────────────────────────────

  /ws:
    get:
      tags: [WebSocket]
      summary: Conexion WebSocket para eventos en tiempo real
      description: |
        Upgrade a WebSocket. No requiere autenticacion de momento.

        Cada mensaje es un JSON con la siguiente estructura:
        ```json
        { "type": "EVENT_TYPE", "tableId": "uuid|null", "orderId": "uuid|null", "saleId": "uuid|null" }
        ```

        Tipos de evento:
        - `ORDER_ITEM_ADDED` — se agrego un item a una orden de mesa
        - `TABLE_UPDATED`    — cambio en salsas, notas, delivery, card de un item/cliente
        - `ORDER_OPENED`     — se abrio una nueva orden en una mesa
        - `ORDER_CLOSED`     — se cerro/cobro una orden
      responses:
        "101":
          description: Switching Protocols — conexion WebSocket establecida
