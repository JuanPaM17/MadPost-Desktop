<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MadPost Desktop</title>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #f8fafc; }
      .boot-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #111827; font-family: Inter, system-ui, sans-serif; }
      .boot-spinner { width: 42px; height: 42px; border: 4px solid #e0e7ff; border-top-color: #6366f1; border-radius: 50%; animation: madpost-spin .8s linear infinite; }
      .boot-title { margin: 22px 0 6px; font-size: 22px; font-weight: 700; }
      .boot-copy { margin: 0; color: #6b7280; font-size: 14px; }
      @keyframes madpost-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen"><div class="boot-spinner"></div><p class="boot-title">MadPost</p><p class="boot-copy">Preparando tu espacio de trabajo</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
